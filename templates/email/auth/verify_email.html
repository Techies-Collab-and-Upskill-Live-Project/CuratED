<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Your CuratED Account</title>
    <style>
        body {
            background: #FEF4EA;
            font-family: 'Poppins';
            color: #2D1500;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 420px;
            margin: 40px auto;
            background: #FEF4EA;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(255, 184, 30, 0.15);
            padding: 32px 28px 28px 28px;
            border-top: 6px solid #008073;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .logo-text {
            font-size: 2rem;
            font-weight: bold;
            color: #008073;
            letter-spacing: 2px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .otp-box {
            background: #FEF4EA;
            color: #008073;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 6px;
            padding: 18px 0;
            border-radius: 8px;
            text-align: center;
            margin: 24px 0 16px 0;
            border: 2px dashed #008073;
        }
        .footer {
            margin-top: 32px;
            font-size: 0.95rem;
            color: #8A8A8A;
            text-align: center;
        }
        .highlight {
            color: #B4931F;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- <span class="logo-text">CuratED</span> -->
            <img src="https://devcurated.vercel.app/favicon/favicon-512x512.png" alt="CuratED Logo" width="120"/>
        </div>
        <h2 style="color:#0F4C78; margin-bottom: 8px;">Verify Your Email</h2>
        <p>Hi there,</p>
        <p>Use the OTP code below to verify your CuratED account:</p>
        <div class="otp-box">{{ otp }}</div>
        <p>This code will expire in <span class="highlight">10 minutes</span>.</p>
        <p>If you didn't request this, you can safely ignore this email.</p>
        <div class="footer">
            &copy; {{ year|default:"2025" }} CuratED. All rights reserved.
        </div>
    </div>
</body>
</html>
